[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "apb-fasta"
version = "0.1.0"
description = "FASTA validation and protein annotation for APB2 results."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Witold Wolski", email = "wew@fgcz.ethz.ch" },
]
dependencies = [
    "apb2>=0.1,<0.2",
    "cyclopts>=4,<5",
    "loguru>=0.7,<1",
    "polars>=1.43,<2",
    "protein-fasta>=0.3,<0.4",
    "prozor>=0.1,<0.2",
]

[project.scripts]
apb-fasta = "apb_fasta.cli:main"

[project.urls]
Repository = "https://github.com/anndata-omics-bridge/apb-fasta"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "import-linter>=2.9,<3",
    "pre-commit>=4,<5",
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "twine>=6,<7",
]

[tool.uv.sources]
apb2 = { path = "../apb2", editable = true }
protein-fasta = { path = "../protein_fasta", editable = true }
prozor = { path = "../prozor", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "B", "C4", "C90", "E4", "E7", "E9", "F", "I", "PGH", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["apb_fasta"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["apb_fasta"]
