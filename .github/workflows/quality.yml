name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apb-fasta
    steps:
      - name: Check out APB FASTA
        uses: actions/checkout@v6
        with:
          path: apb-fasta

      - name: Check out compatible APB2
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb2
          ref: 8651e1fff4772e7c1c1fbb4efe754980799c342d
          path: apb2

      - name: Check out compatible protein-fasta
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/protein-fasta
          ref: bc3fd3609d910549e79049449aba376ad9ab547e
          path: protein_fasta

      - name: Check out compatible Prozor
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/prozor
          ref: 4191a2a6e190a3f7671674593596d6b2baa4e3e1
          path: prozor

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize environment
        run: uv sync --frozen --group dev --group docs

      - name: Run quality gates
        run: make check
