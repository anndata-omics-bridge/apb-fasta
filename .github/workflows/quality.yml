name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apb-fasta
    steps:
      - name: Check out APB FASTA
        uses: actions/checkout@v6
        with:
          path: apb-fasta

      - name: Check out compatible APB2
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb2
          ref: e17bdd26aff10850d6ca418bc7a1d16e28ff4924
          path: apb2

      - name: Check out compatible protein-fasta
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/protein-fasta
          ref: 9f47c394716f66f6dd6e31733a8971a7d1abb2de
          path: protein_fasta

      - name: Check out compatible Prozor
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/prozor
          ref: 5daf8ee4053c9ce5635ad5388d225dc43ab091c0
          path: prozor

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize environment
        run: uv sync --frozen --group dev --group docs

      - name: Run quality gates
        run: make check
